<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Drop50" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Your full-body plan, set log and progress — built for the gym floor." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>Drop50</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="workout" class="workout" hidden></div>
  <nav id="tabbar" class="tabbar" aria-label="Sections">
    <button class="tab" data-act="tab" data-tab="today" aria-label="Today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="9" width="3" height="6" rx="1"/><rect x="18.5" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="6" width="3.5" height="12" rx="1.2"/><rect x="15" y="6" width="3.5" height="12" rx="1.2"/><rect x="9" y="11" width="6" height="2" rx="1"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" data-act="tab" data-tab="progress" aria-label="Progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.5l5.5-6 4 3.5L21 6" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Progress</span>
    </button>
    <button class="tab" data-act="tab" data-tab="plan" aria-label="Plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="3.5" fill="none" stroke-width="2"/><path d="M7.5 9h9M7.5 12.5h9M7.5 16h5" fill="none" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Plan</span>
    </button>
  </nav>
  <div id="rest" class="rest" hidden></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
