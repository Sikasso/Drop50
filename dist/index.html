<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171916" />
  <meta name="description" content="A quiet, practical training and habit tracker." />
  <title>Drop50 — daily practice</title>
  <link rel="stylesheet" href="styles.css?v=20261011-motion-v2" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="wordmark" href="#today" aria-label="Drop50 home"><span class="mark">D<span>50</span></span><span class="wordmark-copy">DROP<span> / DAILY PRACTICE</span></span></a>
      <div class="top-actions"><span class="local-label"><i></i> SAVED ON THIS DEVICE</span><button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">☰</button></div>
    </header>
    <main id="app" class="main-content">
      <div class="loading">Getting your day ready<span>·</span></div>
    </main>
    <nav class="tabbar" aria-label="Main navigation">
      <button class="tab active" data-tab="today"><span class="tab-icon">◷</span><span>Today</span></button>
      <button class="tab" data-tab="train"><span class="tab-icon">↗</span><span>Train</span></button>
      <button class="tab" data-tab="progress"><span class="tab-icon">⌁</span><span>Progress</span></button>
      <button class="tab" data-tab="plan"><span class="tab-icon">▤</span><span>Plan</span></button>
    </nav>
  </div>
  <dialog id="modal" class="modal"><div class="modal-inner"><button class="modal-close" id="modalClose" aria-label="Close">×</button><div id="modalContent"></div></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20261011-motion-v2"></script>
</body>
</html>
